[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convolve"
version = "0.1.0"
description = "Agentic abstention and sequential uncertainty middleware for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Convolve Contributors" }]
keywords = ["llm", "agents", "abstention", "uncertainty", "middleware"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
torch = ["torch>=2.4.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "fakeredis>=2.26.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
convolve = "convolve.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/convolve"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
